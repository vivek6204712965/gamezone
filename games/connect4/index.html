<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connect Four - Arcade Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }
    .game-container {
      max-width: 480px;
      width: 100%;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.15);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #60a5fa;
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
    }
    .mode-toggle {
      display: flex;
      gap: 6px;
    }
    .mode-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #9ca3af;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #60a5fa;
    }
    .status-text {
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    /* Connect 4 Board */
    .board-wrapper {
      background: #1e3a8a;
      padding: 10px;
      border-radius: 14px;
      border: 2px solid #3b82f6;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .column-selectors {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 4px;
    }
    .col-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #93c5fd;
      font-size: 1rem;
      padding: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .col-btn:hover { background: rgba(255, 255, 255, 0.25); color: #fff; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
    }
    .cell {
      aspect-ratio: 1 / 1;
      background: #090d16;
      border-radius: 50%;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cell.red {
      background: radial-gradient(circle at 35% 35%, #f87171, #dc2626);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
    .cell.yellow {
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
    }
    .cell.winning {
      animation: winDisc 0.6s infinite alternate;
    }
    @keyframes winDisc {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.15); filter: brightness(1.5); }
    }
    .btn-reset {
      display: block;
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s;
    }
    .btn-reset:hover { transform: scale(1.02); }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <div class="title">🔴 Connect Four 🟡</div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn1P">vs AI</button>
        <button class="mode-btn" id="btn2P">2 Player</button>
      </div>
    </div>

    <div class="status-text" id="statusText">Red's Turn (Player 1)</div>

    <div class="board-wrapper">
      <div class="column-selectors">
        <button class="col-btn" data-c="0">▼</button>
        <button class="col-btn" data-c="1">▼</button>
        <button class="col-btn" data-c="2">▼</button>
        <button class="col-btn" data-c="3">▼</button>
        <button class="col-btn" data-c="4">▼</button>
        <button class="col-btn" data-c="5">▼</button>
        <button class="col-btn" data-c="6">▼</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <button class="btn-reset" id="resetBtn">Restart Game</button>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(f, t = 'sine', d = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = t;
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + d);
    }
    const sndDrop = () => sfx(240, 'triangle', 0.08);
    const sndWin = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx(f, 'sine', 0.12), i * 70)); };

    const ROWS = 6;
    const COLS = 7;
    let board = [];
    let turn = 'red'; // 'red' or 'yellow'
    let isGameOver = false;
    let vsAI = true;

    const gridEl = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const colBtns = document.querySelectorAll('.col-btn');

    function init() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      turn = 'red';
      isGameOver = false;
      statusText.innerHTML = `<span style="color:#ef4444;">Red</span>'s Turn`;
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          cell.onclick = () => dropDisc(c);
          gridEl.appendChild(cell);
        }
      }
    }

    function dropDisc(c) {
      if (isGameOver) return;

      // Find lowest empty row in col c
      let targetRow = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][c]) {
          targetRow = r;
          break;
        }
      }
      if (targetRow === -1) return; // Col full

      board[targetRow][c] = turn;
      const cell = document.getElementById(`cell-${targetRow}-${c}`);
      cell.classList.add(turn);
      sndDrop();

      const winLine = checkWin(turn);
      if (winLine) {
        isGameOver = true;
        winLine.forEach(([r, c]) => {
          document.getElementById(`cell-${r}-${c}`).classList.add('winning');
        });
        statusText.innerHTML = `🎉 <span style="color:${turn === 'red' ? '#ef4444' : '#eab308'}; font-weight:bold;">${turn.toUpperCase()}</span> WINS!`;
        sndWin();

        // Count only when human ('red') wins against AI
        if (vsAI && turn === 'red') {
          try {
            const current = parseInt(localStorage.getItem('connect4_ai_wins'), 10) || 0;
            localStorage.setItem('connect4_ai_wins', String(current + 1));
          } catch (e) {
            console.warn('Could not save connect4 record:', e);
          }
        }
        return;
      }

      // Check board full
      if (board.every(row => row.every(val => val !== null))) {
        isGameOver = true;
        statusText.textContent = "It's a Draw!";
        return;
      }

      turn = turn === 'red' ? 'yellow' : 'red';
      statusText.innerHTML = `<span style="color:${turn === 'red' ? '#ef4444' : '#eab308'}; font-weight:bold;">${turn === 'red' ? 'Red' : 'Yellow'}</span>'s Turn`;

      if (vsAI && turn === 'yellow' && !isGameOver) {
        setTimeout(aiMove, 350);
      }
    }

    function aiMove() {
      if (isGameOver) return;
      // 1. Can AI win?
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmpty(c);
        if (r !== -1) {
          board[r][c] = 'yellow';
          if (checkWin('yellow')) { board[r][c] = null; dropDisc(c); return; }
          board[r][c] = null;
        }
      }

      // 2. Can AI block Red win?
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmpty(c);
        if (r !== -1) {
          board[r][c] = 'red';
          if (checkWin('red')) { board[r][c] = null; dropDisc(c); return; }
          board[r][c] = null;
        }
      }

      // 3. Prefer center column if available
      const preferred = [3, 2, 4, 1, 5, 0, 6];
      for (let c of preferred) {
        if (getLowestEmpty(c) !== -1) {
          dropDisc(c);
          return;
        }
      }
    }

    function getLowestEmpty(c) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][c]) return r;
      }
      return -1;
    }

    function checkWin(player) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (board[r][c] === player && board[r][c+1] === player && board[r][c+2] === player && board[r][c+3] === player) {
            return [[r,c], [r,c+1], [r,c+2], [r,c+3]];
          }
        }
      }
      // Vertical
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === player && board[r+1][c] === player && board[r+2][c] === player && board[r+3][c] === player) {
            return [[r,c], [r+1,c], [r+2,c], [r+3,c]];
          }
        }
      }
      // Diagonal /
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (board[r][c] === player && board[r-1][c+1] === player && board[r-2][c+2] === player && board[r-3][c+3] === player) {
            return [[r,c], [r-1,c+1], [r-2,c+2], [r-3,c+3]];
          }
        }
      }
      // Diagonal \
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (board[r][c] === player && board[r+1][c+1] === player && board[r+2][c+2] === player && board[r+3][c+3] === player) {
            return [[r,c], [r+1,c+1], [r+2,c+2], [r+3,c+3]];
          }
        }
      }
      return null;
    }

    colBtns.forEach(btn => {
      btn.onclick = () => dropDisc(parseInt(btn.dataset.c, 10));
    });

    document.getElementById('resetBtn').onclick = init;
    document.getElementById('btn1P').onclick = () => {
      vsAI = true;
      document.getElementById('btn1P').classList.add('active');
      document.getElementById('btn2P').classList.remove('active');
      init();
    };
    document.getElementById('btn2P').onclick = () => {
      vsAI = false;
      document.getElementById('btn2P').classList.add('active');
      document.getElementById('btn1P').classList.remove('active');
      init();
    };

    init();
  </script>
</body>
</html>
