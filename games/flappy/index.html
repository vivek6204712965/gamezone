<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Cyber - Arcade Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(14, 165, 233, 0.3);
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.2);
      border-radius: 16px;
      padding: 16px;
      max-width: 420px;
      width: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .scores {
      display: flex;
      gap: 10px;
    }
    .score-box {
      background: #1e293b;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .score-box span { color: #38bdf8; }
    .canvas-wrapper {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    canvas { display: block; background: #070e1b; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      font-size: 1.8rem;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
    }
    .btn {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
      transition: all 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .controls-hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <div class="title">🐦 Flappy Cyber</div>
      <div class="scores">
        <div class="score-box">Score: <span id="scoreVal">0</span></div>
        <div class="score-box">Best: <span id="bestVal">0</span></div>
      </div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="gameCanvas" width="360" height="520"></canvas>
      <div id="startOverlay" class="overlay">
        <h2>FLAPPY CYBER</h2>
        <p style="color:#94a3b8; font-size:0.9rem;">Tap or Space to Flap!</p>
        <button class="btn" id="startBtn">TAP TO FLY</button>
      </div>
      <div id="gameOverOverlay" class="overlay hidden">
        <h2 style="color:#ef4444;">CRASHED!</h2>
        <p>Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
        <button class="btn" id="restartBtn">TRY AGAIN</button>
      </div>
    </div>

    <div class="controls-hint">
      Press <b>Spacebar</b>, <b>Click</b>, or <b>Tap anywhere</b> to fly!
    </div>
  </div>

  <script>
    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type = 'sine', dur = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }
    const sndFlap = () => beep(420, 'sine', 0.07);
    const sndScore = () => { beep(587, 'sine', 0.08); setTimeout(() => beep(880, 'sine', 0.12), 60); };
    const sndCrash = () => beep(130, 'sawtooth', 0.3);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const finalScore = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    let highScore = parseInt(localStorage.getItem('flappy_cyber_best') || '0', 10);
    bestVal.textContent = highScore;

    let bird = { x: 70, y: 240, vy: 0, radius: 14 };
    let pipes = [];
    let score = 0;
    let isPlaying = false;
    let frame = 0;
    const GRAVITY = 0.38;
    const JUMP = -6.8;
    const PIPE_SPEED = 2.2;
    const PIPE_GAP = 125;
    const PIPE_INTERVAL = 110;

    function resetGame() {
      bird.y = 240;
      bird.vy = 0;
      pipes = [];
      score = 0;
      frame = 0;
      scoreVal.textContent = score;
    }

    function flap() {
      if (!isPlaying) return;
      bird.vy = JUMP;
      sndFlap();
    }

    function spawnPipe() {
      const minTop = 60;
      const maxTop = canvas.height - PIPE_GAP - 90;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + PIPE_GAP,
        passed: false
      });
    }

    function drawBackground() {
      // Stars & city silhouette
      ctx.fillStyle = '#070e1b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Neon grid lines at the ground
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();

      // Moving ground ticks
      const groundOffset = (frame * PIPE_SPEED) % 25;
      ctx.strokeStyle = 'rgba(14, 165, 233, 0.4)';
      for (let x = -groundOffset; x < canvas.width; x += 25) {
        ctx.beginPath();
        ctx.moveTo(x, canvas.height - 40);
        ctx.lineTo(x - 10, canvas.height);
        ctx.stroke();
      }
    }

    function drawPipes() {
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(p.x, 0, 52, p.top);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, 0, 52, p.top);

        // Cap for top pipe
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(p.x - 4, p.top - 20, 60, 20);
        ctx.strokeRect(p.x - 4, p.top - 20, 60, 20);

        // Bottom pipe
        const bottomHeight = canvas.height - 40 - p.bottom;
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(p.x, p.bottom, 52, bottomHeight);
        ctx.strokeRect(p.x, p.bottom, 52, bottomHeight);

        // Cap for bottom pipe
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(p.x - 4, p.bottom, 60, 20);
        ctx.strokeRect(p.x - 4, p.bottom, 60, 20);
      });
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));
      ctx.rotate(angle);

      // Bird body
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Bird Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      const wingY = Math.sin(frame * 0.4) * 4;
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.ellipse(-5, wingY, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(18, 2);
      ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      frame++;
      drawBackground();

      if (isPlaying) {
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        // Pipe spawning
        if (frame % PIPE_INTERVAL === 0) spawnPipe();

        // Pipe logic
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          // Check pass
          if (!p.passed && p.x + 52 < bird.x) {
            p.passed = true;
            score++;
            scoreVal.textContent = score;
            sndScore();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('flappy_cyber_best', highScore);
              bestVal.textContent = highScore;
            }
          }

          // Check collision
          const birdBox = {
            left: bird.x - bird.radius + 3,
            right: bird.x + bird.radius - 3,
            top: bird.y - bird.radius + 3,
            bottom: bird.y + bird.radius - 3
          };

          const topPipe = { left: p.x, right: p.x + 52, top: 0, bottom: p.top };
          const botPipe = { left: p.x, right: p.x + 52, top: p.bottom, bottom: canvas.height - 40 };

          if (rectCollide(birdBox, topPipe) || rectCollide(birdBox, botPipe)) {
            gameOver();
            return;
          }

          // Remove out of screen pipes
          if (p.x + 60 < 0) pipes.splice(i, 1);
        }

        // Ceiling and floor collision
        if (bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height - 40) {
          gameOver();
          return;
        }
      }

      drawPipes();
      drawBird();

      if (isPlaying) {
        requestAnimationFrame(loop);
      }
    }

    function rectCollide(r1, r2) {
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      sndCrash();
      finalScore.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isPlaying && !startOverlay.classList.contains('hidden')) startGame();
        else if (!isPlaying && !gameOverOverlay.classList.contains('hidden')) startGame();
        else flap();
      }
    });

    const canvasWrapper = document.getElementById('canvasWrapper');
    canvasWrapper.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'BUTTON') return;
      if (!isPlaying) startGame();
      else flap();
    });

    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = startGame;

    drawBackground();
    drawBird();
  </script>
</body>
</html>
